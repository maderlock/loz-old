<style>
.quotecaption {
	color: white;

}
blockquote {
	background: rgb(0%,0%,0%);

	color: #FFFFFF;
}
.frontquote {
	position: absolute;
	left: 33.75%;
	top: 88.87%;
	width: 50%;
}
#containerCustom {
	position: relative;
	width: 800px;
	max-width: 100%;
	margin: auto;
}
#containerCustom img {
	max-width: 100%;
	height: auto;
	display: block;
}

/* Below 700px the graphic scales down fluidly along with the shrinking
   viewport (the rule above already handles that via max-width: 100%);
   by the time we reach 500px it's touching both edges. */

/* Below 500px: actual mobile view. The graphic stops shrinking so its
   clickable areas stay tappable - it's pinned to the left instead, and
   allowed to run off the right edge on very narrow phones (the whole
   page will scroll horizontally in that case, which is fine since the
   homepage has nothing else on it). */
@media (max-width: 500px) {
	#containerCustom {
		width: 460px;
		max-width: none;
		margin: 0 0 0 12px;
	}
	.frontquote {
		left: 0;
		width: 100%;
	}
	.quotecaption {
		margin-left: 0;
	}
}
</style>
</head>

<script type="text/javascript">
$(function() {
	var $img = $('#containerCustom img[usemap]');
	function rescaleImageMap() {
		var scaleX = $img.width() / $img[0].naturalWidth;
		var scaleY = $img.height() / $img[0].naturalHeight;
		$('#imgmap area').each(function() {
			var orig = $(this).attr('data-coords').split(',');
			var scaled = $.map(orig, function(n, i) {
				return Math.round(n * (i % 2 === 0 ? scaleX : scaleY));
			});
			$(this).attr('coords', scaled.join(','));
		});
	}
	$img.bind('load', rescaleImageMap);
	if ($img[0].complete) { rescaleImageMap(); }
	$(window).bind('resize', rescaleImageMap);
});
</script>
</body>
